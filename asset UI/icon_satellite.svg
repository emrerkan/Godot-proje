<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <filter id="glow-sat" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Scanning Radar Waves -->
  <g stroke="#A855F7" stroke-width="8" stroke-linecap="round" opacity="0.75">
    <path d="M 170 360 A 130 130 0 0 0 342 360"/>
    <path d="M 125 405 A 190 190 0 0 0 387 405" stroke-width="6" opacity="0.5"/>
    <path d="M 80 450 A 250 250 0 0 0 432 450" stroke-width="4" opacity="0.3"/>
  </g>
  <!-- Satellite Craft -->
  <g filter="url(#glow-sat)">
    <!-- Solar Panels -->
    <!-- Left Wing -->
    <line x1="205" y1="210" x2="165" y2="210" stroke="#CBD5E1" stroke-width="10"/>
    <rect x="50" y="145" width="52" height="130" rx="6" fill="#0C1D4A" stroke="#A855F7" stroke-width="6"/>
    <line x1="76" y1="145" x2="76" y2="275" stroke="#38BDF8" stroke-width="3"/>
    <line x1="50" y1="210" x2="102" y2="210" stroke="#38BDF8" stroke-width="3"/>

    <rect x="110" y="145" width="52" height="130" rx="6" fill="#0C1D4A" stroke="#A855F7" stroke-width="6"/>
    <line x1="136" y1="145" x2="136" y2="275" stroke="#38BDF8" stroke-width="3"/>
    <line x1="110" y1="210" x2="162" y2="210" stroke="#38BDF8" stroke-width="3"/>

    <!-- Right Wing -->
    <line x1="307" y1="210" x2="347" y2="210" stroke="#CBD5E1" stroke-width="10"/>
    <rect x="350" y="145" width="52" height="130" rx="6" fill="#0C1D4A" stroke="#A855F7" stroke-width="6"/>
    <line x1="376" y1="145" x2="376" y2="275" stroke="#38BDF8" stroke-width="3"/>
    <line x1="350" y1="210" x2="402" y2="210" stroke="#38BDF8" stroke-width="3"/>

    <rect x="410" y="145" width="52" height="130" rx="6" fill="#0C1D4A" stroke="#A855F7" stroke-width="6"/>
    <line x1="436" y1="145" x2="436" y2="275" stroke="#38BDF8" stroke-width="3"/>
    <line x1="410" y1="210" x2="462" y2="210" stroke="#38BDF8" stroke-width="3"/>

    <!-- Main Bus Chassis -->
    <polygon points="220,140 292,140 310,165 310,255 292,280 220,280 202,255 202,165" fill="#F8FAFC" stroke="#A855F7" stroke-width="10"/>
    <!-- Gold Thermal Foil -->
    <rect x="207" y="195" width="98" height="36" fill="#F59E0B"/>
    <!-- Sensor Dome -->
    <circle cx="256" cy="213" r="18" fill="#A855F7"/>

    <!-- Parabolic Dish Antenna -->
    <path d="M 205 295 A 55 45 0 0 0 307 295" stroke="#CBD5E1" stroke-width="14" fill="none"/>
    <path d="M 205 295 A 55 45 0 0 0 307 295" stroke="#A855F7" stroke-width="6" fill="none"/>
    <!-- Feed Horn -->
    <line x1="256" y1="322" x2="256" y2="350" stroke="#A855F7" stroke-width="8"/>
    <circle cx="256" cy="354" r="8" fill="#C084FC"/>
  </g>
</svg>