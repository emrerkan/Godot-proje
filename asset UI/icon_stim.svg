<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <filter id="glow-st" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Medical Aura -->
  <g stroke="#22C55E" stroke-width="6" stroke-linecap="round" opacity="0.6">
    <path d="M 140 120 A 180 180 0 0 0 100 240"/>
    <path d="M 412 272 A 180 180 0 0 1 372 392"/>
    <!-- Cross particles -->
    <path d="M 110 320 L 110 340 M 100 330 L 120 330" stroke-width="6"/>
    <path d="M 390 160 L 390 180 M 380 170 L 400 170" stroke-width="6"/>
  </g>
  <!-- Angled Stim Injector -->
  <g transform="rotate(-35 256 256)" filter="url(#glow-st)">
    <!-- Needle -->
    <polygon points="253,440 259,440 262,370 250,370" fill="#E2E8F0"/>
    <polygon points="236,370 276,370 290,325 222,325" fill="#475569" stroke="#22C55E" stroke-width="6"/>
    <rect x="220" y="310" width="72" height="16" rx="4" fill="#F59E0B"/>
    <!-- Fluid Cylinder -->
    <rect x="210" y="170" width="92" height="142" rx="14" fill="#0F2E22" stroke="#E2E8F0" stroke-width="6"/>
    <rect x="218" y="180" width="76" height="124" rx="10" fill="#22C55E"/>
    <!-- Cage Struts -->
    <rect x="212" y="170" width="14" height="142" rx="4" fill="#F8FAFC"/>
    <rect x="250" y="170" width="12" height="142" rx="4" fill="#F8FAFC"/>
    <rect x="286" y="170" width="14" height="142" rx="4" fill="#F8FAFC"/>
    <!-- Body -->
    <rect x="200" y="80" width="112" height="95" rx="16" fill="#F8FAFC" stroke="#22C55E" stroke-width="8"/>
    <!-- Cross -->
    <rect x="248" y="102" width="16" height="50" rx="3" fill="#22C55E"/>
    <rect x="231" y="119" width="50" height="16" rx="3" fill="#22C55E"/>
    <!-- Wings -->
    <rect x="140" y="105" width="62" height="26" rx="8" fill="#E2E8F0" stroke="#22C55E" stroke-width="5"/>
    <rect x="310" y="105" width="62" height="26" rx="8" fill="#E2E8F0" stroke="#22C55E" stroke-width="5"/>
    <!-- Plunger -->
    <rect x="242" y="30" width="28" height="52" fill="#64748B" stroke="#22C55E" stroke-width="4"/>
    <rect x="195" y="10" width="122" height="24" rx="8" fill="#334155" stroke="#22C55E" stroke-width="6"/>
  </g>
</svg>