<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <filter id="glow-fb" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Flash Rays -->
  <g stroke="#FACC15" stroke-width="10" stroke-linecap="round" opacity="0.8">
    <line x1="256" y1="70" x2="256" y2="120" stroke-width="16"/>
    <line x1="256" y1="392" x2="256" y2="442" stroke-width="16"/>
    <line x1="70" y1="256" x2="120" y2="256" stroke-width="16"/>
    <line x1="392" y1="256" x2="442" y2="256" stroke-width="16"/>
    <line x1="125" y1="125" x2="160" y2="160"/>
    <line x1="352" y1="352" x2="387" y2="387"/>
    <line x1="125" y1="387" x2="160" y2="352"/>
    <line x1="352" y1="160" x2="387" y2="125"/>
  </g>
  <!-- Canister Body -->
  <g filter="url(#glow-fb)">
    <rect x="200" y="180" width="112" height="180" rx="18" fill="#F1F5F9" stroke="#FACC15" stroke-width="10"/>
    <!-- Vents -->
    <rect x="220" y="215" width="28" height="32" rx="6" fill="#FACC15"/>
    <rect x="264" y="215" width="28" height="32" rx="6" fill="#FACC15"/>
    <rect x="220" y="260" width="28" height="32" rx="6" fill="#FACC15"/>
    <rect x="264" y="260" width="28" height="32" rx="6" fill="#FACC15"/>
    <rect x="220" y="305" width="28" height="32" rx="6" fill="#FACC15"/>
    <rect x="264" y="305" width="28" height="32" rx="6" fill="#FACC15"/>
    <!-- Head Cap -->
    <rect x="224" y="145" width="64" height="40" rx="8" fill="#94A3B8" stroke="#FACC15" stroke-width="8"/>
    <!-- Lever -->
    <path d="M 288 150 L 325 180 L 325 330 L 310 330 L 310 185 Z" fill="#FACC15"/>
    <!-- Ring -->
    <circle cx="185" cy="145" r="22" stroke="#E2E8F0" stroke-width="10" fill="none"/>
    <circle cx="185" cy="145" r="22" stroke="#FACC15" stroke-width="4" fill="none"/>
  </g>
</svg>